name: Windows Bring-up

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: windows-bringup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    name: Windows MSVC CLI
    runs-on: windows-2025-vs2026

    env:
      FC_CACHE_DIR: ${{ github.workspace }}\.fc-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Restore FetchContent cache
        uses: actions/cache@v5
        with:
          path: .fc-cache
          key: fc-windows-${{ hashFiles('cmake/MRDependencies.cmake', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            fc-windows-

      - name: Locate MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installPath)) {
            throw "Visual Studio with VC tools was not found"
          }
          $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) {
            throw "vcvars64.bat not found at $vcvars"
          }
          "VCVARS64=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using MSVC environment: $vcvars"

      - name: Configure
        shell: cmd
        run: |
          call "%VCVARS64%"
          cmake -S . -B build/windows -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DFETCHCONTENT_BASE_DIR="%FC_CACHE_DIR%" ^
            -DMR_ADM_CORE_BUILD_TESTS=ON ^
            -DMR_ADM_FLAC_PROVIDER=VENDORED ^
            -DMR_ADM_OPUS_PROVIDER=VENDORED

      - name: Build CLI
        shell: cmd
        run: |
          call "%VCVARS64%"
          cmake --build build/windows --target mradm_exe mr_adm_flac_io_smoke_tests

      - name: Smoke
        shell: pwsh
        run: |
          .\build\windows\mradm.exe --version
          .\build\windows\mradm.exe backends
          .\build\windows\mr_adm_flac_io_smoke_tests.exe

      - name: Prepare artifact
        shell: pwsh
        run: |
          $root = "artifact\mradm-windows-x64"
          $bin = Join-Path $root "bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Copy-Item ".\build\windows\mradm.exe" -Destination $bin -Force

          foreach ($dir in @(
            ".\build\windows"
          )) {
            if (Test-Path $dir) {
              Get-ChildItem -Path $dir -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object { Copy-Item $_.FullName -Destination $bin -Force }
            }
          }

          $exe = (Resolve-Path ".\build\windows\mradm.exe").Path
          $depsCmd = Join-Path $env:RUNNER_TEMP "mradm-deps.cmd"
          $depsScript = @"
          @echo off
          call "$env:VCVARS64"
          dumpbin /dependents "$exe"
          "@
          $depsScript | Set-Content -Path $depsCmd -Encoding ASCII
          cmd /c $depsCmd | Out-File -FilePath (Join-Path $root "DEPENDENCIES.txt") -Encoding utf8

          @(
            "name=mradm-windows-x64",
            "commit=${{ github.sha }}",
            "runner=${{ runner.os }}",
            "build_type=Release",
            "compiler=MSVC",
            "flac_provider=VENDORED",
            "opus_provider=VENDORED"
          ) | Set-Content -Path (Join-Path $root "BUILD_INFO.txt") -Encoding utf8

      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: mradm-windows-x64
          path: artifact/mradm-windows-x64
          if-no-files-found: error
