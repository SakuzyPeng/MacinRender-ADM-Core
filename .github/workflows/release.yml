name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS release
            runner: macos-26
            artifact: mradm-macos-arm64
            platform: macos
            arch: arm64
            binary: build/release/mradm
            install: brew install cmake ninja ccache

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      FC_CACHE_DIR: ${{ github.workspace }}/.fc-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Restore FetchContent cache
        uses: actions/cache@v5
        with:
          path: .fc-cache
          key: fc-${{ runner.os }}-${{ hashFiles('cmake/MRDependencies.cmake', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            fc-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-release-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-release-
            ccache-${{ runner.os }}-

      - name: Configure
        run: >
          cmake --preset release
          -DFETCHCONTENT_BASE_DIR="$FC_CACHE_DIR"
          -DMR_ADM_CORE_USE_INSTALLED_DEPS=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_fmt=TRUE
          -DCMAKE_DISABLE_FIND_PACKAGE_spdlog=TRUE
          -DCMAKE_DISABLE_FIND_PACKAGE_CLI11=TRUE
          -DMR_ADM_FLAC_PROVIDER=VENDORED
          -DMR_ADM_OPUS_PROVIDER=VENDORED
          -DMR_ADM_ENABLE_IAMF=OFF
          -DMR_ADM_BUILD_CAPI_BUNDLE=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset release --target mradm_exe mradm_capi_bundle

      - name: License full-coverage check
        run: scripts/quality/check-licenses.sh --build-dir build/release --require-full

      - name: C ABI exports
        run: python3 scripts/quality/check-capi-exports.py "build/release/libmradm_capi.$([ "$RUNNER_OS" = macOS ] && echo dylib || echo so)"

      - name: Smoke
        run: |
          "${{ matrix.binary }}" --version
          "${{ matrix.binary }}" backends

      - name: Package
        run: >
          scripts/release/package-macos-cli-release.sh
          --binary "${{ matrix.binary }}"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --cmake-options "release; fmt/spdlog/CLI11 FetchContent; MR_ADM_FLAC_PROVIDER=VENDORED; MR_ADM_OPUS_PROVIDER=VENDORED; MR_ADM_ENABLE_IAMF=OFF"

      - name: Package smoke
        run: |
          archive="$(ls dist/mradm-*-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz)"
          scripts/release/smoke-macos-cli-release.sh "$archive"

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/mradm-*-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz
            dist/mradm-*-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

  release-linux-appimage:
    name: Linux AppImage release
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      FC_CACHE_DIR: ${{ github.workspace }}/.fc-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential git pkg-config ccache curl file patchelf desktop-file-utils
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Restore FetchContent cache
        uses: actions/cache@v5
        with:
          path: .fc-cache
          key: fc-${{ runner.os }}-${{ hashFiles('cmake/MRDependencies.cmake', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            fc-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-release-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-release-
            ccache-${{ runner.os }}-

      - name: Configure
        run: >
          cmake --preset release
          -DFETCHCONTENT_BASE_DIR="$FC_CACHE_DIR"
          -DMR_ADM_CORE_USE_INSTALLED_DEPS=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_fmt=TRUE
          -DCMAKE_DISABLE_FIND_PACKAGE_spdlog=TRUE
          -DCMAKE_DISABLE_FIND_PACKAGE_CLI11=TRUE
          -DMR_ADM_FLAC_PROVIDER=VENDORED
          -DMR_ADM_OPUS_PROVIDER=VENDORED
          -DMR_ADM_ENABLE_IAMF=OFF
          -DMR_ADM_BUILD_CAPI_BUNDLE=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset release --target mradm_exe mradm_capi_bundle

      - name: License full-coverage check
        run: scripts/quality/check-licenses.sh --build-dir build/release --require-full

      - name: C ABI exports
        run: python3 scripts/quality/check-capi-exports.py "build/release/libmradm_capi.$([ "$RUNNER_OS" = macOS ] && echo dylib || echo so)"

      - name: Smoke
        run: |
          build/release/mradm --version
          build/release/mradm backends

      - name: Package AppImage
        run: >
          scripts/release/package-linux-cli-appimage-release.sh
          --binary build/release/mradm
          --arch x86_64

      - name: AppImage smoke
        run: |
          appimage="$(ls dist/mradm-*-linux-x86_64.AppImage)"
          scripts/release/smoke-linux-cli-appimage-release.sh "$appimage"

      - name: Upload AppImage release package
        uses: actions/upload-artifact@v7
        with:
          name: mradm-linux-x86_64-AppImage
          path: |
            dist/mradm-*-linux-x86_64.AppImage
            dist/mradm-*-linux-x86_64.AppImage.sha256
          if-no-files-found: error

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

  release-windows:
    name: Windows release
    runs-on: windows-2025-vs2026

    env:
      FC_CACHE_DIR: ${{ github.workspace }}\.fc-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Restore FetchContent cache
        uses: actions/cache@v5
        with:
          path: .fc-cache
          key: fc-windows-${{ hashFiles('cmake/MRDependencies.cmake', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            fc-windows-

      - name: Locate MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installPath)) {
            throw "Visual Studio with VC tools was not found"
          }
          $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) {
            throw "vcvars64.bat not found at $vcvars"
          }
          "VCVARS64=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using MSVC environment: $vcvars"

      - name: Configure
        shell: cmd
        run: |
          call "%VCVARS64%"
          cmake -S . -B build/windows -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DFETCHCONTENT_BASE_DIR="%FC_CACHE_DIR%" ^
            -DMR_ADM_CORE_BUILD_TESTS=ON ^
            -DMR_ADM_FLAC_PROVIDER=VENDORED ^
            -DMR_ADM_OPUS_PROVIDER=VENDORED ^
            -DMR_ADM_ENABLE_IAMF=OFF ^
            -DMR_ADM_BUILD_CAPI_BUNDLE=ON

      # Optimized render fixtures cover the release codegen of each renderer and the main encoders.
      - name: Build
        shell: cmd
        run: |
          call "%VCVARS64%"
          cmake --build build/windows --target mradm_exe mradm_capi_bundle ^
            mr_adm_flac_io_smoke_tests mr_adm_opus_mka_smoke_tests mr_adm_cli_smoke_tests ^
            mr_adm_ear_fixture_tests mr_adm_vbap_smoke_tests mr_adm_hoa_encode_fixture_tests ^
            mr_adm_binaural_fixture_tests mr_adm_sofa_fixture_tests mr_adm_loudness_fixture_tests

      - name: C ABI exports
        shell: pwsh
        run: python scripts/quality/check-capi-exports.py build/windows/mradm_capi.dll

      - name: Smoke
        shell: pwsh
        run: |
          .\build\windows\mradm.exe --version
          .\build\windows\mradm.exe backends

      - name: Render fixtures
        shell: cmd
        run: |
          call "%VCVARS64%"
          ctest --test-dir build/windows --output-on-failure -j %NUMBER_OF_PROCESSORS% ^
            -R "^(mr_adm_flac_io_smoke_tests|mr_adm_opus_mka_smoke_tests|mr_adm_cli_smoke_tests|mr_adm_ear_fixture_tests|mr_adm_vbap_smoke_tests|mr_adm_hoa_encode_fixture_tests|mr_adm_binaural_fixture_tests|mr_adm_sofa_fixture_tests|mr_adm_loudness_fixture_tests)$"

      - name: Package
        shell: pwsh
        run: >
          .\scripts\release\package-windows-cli-release.ps1
          -Binary ".\build\windows\mradm.exe"
          -Arch "x64"
          -CmakeOptions "Release; MR_ADM_FLAC_PROVIDER=VENDORED; MR_ADM_OPUS_PROVIDER=VENDORED; MR_ADM_ENABLE_IAMF=OFF; Rust DSP"

      - name: Package smoke
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path dist -Filter "mradm-*-windows-x64.zip" | Select-Object -First 1
          if ($null -eq $archive) { throw "Windows release package was not produced" }
          .\scripts\release\smoke-windows-cli-release.ps1 -Archive $archive.FullName

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: mradm-windows-x64
          path: |
            dist/mradm-*-windows-x64.zip
            dist/mradm-*-windows-x64.zip.sha256
          if-no-files-found: error

  release-gui-macos:
    name: macOS GUI release
    runs-on: macos-26

    env:
      FC_CACHE_DIR: ${{ github.workspace }}/.fc-cache
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore FetchContent cache
        uses: actions/cache@v5
        with:
          path: .fc-cache
          key: fc-gui-macos-${{ hashFiles('cmake/MRDependencies.cmake', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            fc-gui-macos-
            fc-${{ runner.os }}-

      - name: Package GUI
        run: scripts/release/package-macos-gui-release.sh --rid osx-arm64

      - name: Package smoke
        run: |
          archive="$(ls dist/MacinRender-Gui-*-macos-arm64.tar.gz)"
          scripts/release/smoke-macos-gui-release.sh "$archive"

      - name: Upload GUI release package
        uses: actions/upload-artifact@v7
        with:
          name: MacinRender-Gui-macos-arm64
          path: |
            dist/MacinRender-Gui-*-macos-arm64.tar.gz
            dist/MacinRender-Gui-*-macos-arm64.tar.gz.sha256
          if-no-files-found: error

  release-gui-windows:
    name: Windows GUI release
    runs-on: windows-2025-vs2026

    env:
      FC_CACHE_DIR: ${{ github.workspace }}\.fc-cache
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore FetchContent cache
        uses: actions/cache@v5
        with:
          path: .fc-cache
          key: fc-gui-windows-${{ hashFiles('cmake/MRDependencies.cmake', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            fc-gui-windows-
            fc-windows-

      - name: Locate MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installPath)) {
            throw "Visual Studio with VC tools was not found"
          }
          $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) {
            throw "vcvars64.bat not found at $vcvars"
          }
          "VCVARS64=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using MSVC environment: $vcvars"

      - name: Package GUI
        shell: pwsh
        run: >
          .\scripts\release\package-windows-gui-release.ps1
          -Rid "win-x64"
          -CmakeOptions "Release; MR_ADM_BUILD_CAPI_BUNDLE=ON; MR_ADM_FLAC_PROVIDER=VENDORED; MR_ADM_OPUS_PROVIDER=VENDORED; MR_ADM_ENABLE_IAMF=OFF; Rust DSP"

      - name: Package smoke
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path dist -Filter "MacinRender-Gui-*-windows-x64.zip" | Select-Object -First 1
          if ($null -eq $archive) { throw "Windows GUI release package was not produced" }
          .\scripts\release\smoke-windows-gui-release.ps1 -Archive $archive.FullName

      - name: Upload GUI release package
        uses: actions/upload-artifact@v7
        with:
          name: MacinRender-Gui-windows-x64
          path: |
            dist/MacinRender-Gui-*-windows-x64.zip
            dist/MacinRender-Gui-*-windows-x64.zip.sha256
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - release
      - release-windows
      - release-gui-macos
      - release-gui-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s globstar nullglob
          assets=()
          for asset in release-assets/**/*; do
            [[ -f "$asset" ]] && assets+=("$asset")
          done
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "no release assets were downloaded" >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --title "$TAG_NAME" \
              --notes "Automated release for $TAG_NAME."
          fi
