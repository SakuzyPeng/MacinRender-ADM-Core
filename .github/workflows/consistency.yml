name: Consistency

# Rust phase 2 is closed for the versioned Release matrix (RUST_PHASE2_CLOSEOUT.md).
# scripts/consistency/phase2-gates.json defines the exact PCM and kernel equality gates.
# A is default; B controls C/C++ floating point only. RustFFT uses its scalar planner in both.
# Each job rebuilds in place for diagnostic noninterference and bounded attribution.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: ${{ matrix.name }} (config ${{ matrix.config }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # platform stays a real matrix key so each include entry expands only its own platform.
        # As include-only keys they would instead be layered onto every combination in turn,
        # leaving both jobs on whichever runner came last.
        platform: [macos, linux]
        config: [a, b]
        include:
          - platform: macos
            name: macOS render
            runner: macos-26
            install: brew install cmake ninja ccache
          - platform: linux
            name: Linux render
            runner: ubuntu-24.04
            install: |
              sudo apt-get update
              sudo apt-get install -y cmake ninja-build build-essential git pkg-config ccache

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      FC_CACHE_DIR: ${{ github.workspace }}/.fc-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Restore FetchContent cache
        uses: actions/cache@v5
        with:
          path: .fc-cache
          key: fc-${{ runner.os }}-${{ hashFiles('cmake/MRDependencies.cmake', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            fc-${{ runner.os }}-

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            build/rust/
          key: cargo-${{ runner.os }}-consistency-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-consistency-

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-consistency-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-consistency-${{ matrix.config }}-
            ccache-${{ runner.os }}-

      # The consistency-* presets are Release: the determinism contract is a release-configuration
      # property, and Debug codegen would not represent what ships. They also pin FLAC/Opus to
      # vendored and disable installed-package lookup, so A and B differ only in the numeric
      # options under test.
      # MR_ADM_CORE_BUILD_TESTS is passed explicitly: the tools live in the tests section of
      # CMakeLists.txt, so turning it off would fail this workflow with an opaque "no rule to
      # make target" rather than something that points at the cause.
      - name: Configure
        run: >
          cmake --preset consistency-${{ matrix.config }}
          -DFETCHCONTENT_BASE_DIR="$FC_CACHE_DIR"
          -DMR_ADM_CORE_BUILD_TESTS=ON
          -DMR_ADM_ENABLE_IAMF=OFF
          -DMR_ADM_ENABLE_SOFA=ON
          -DMR_ADM_CONSISTENCY_DIAGNOSTICS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Reuse this build/Cargo directory. The helper restores both Cargo manifests
      # before the candidate is built; reference preparation is not PCM evidence.
      - name: Prepare original scalar FFT benchmark
        if: matrix.config == 'a'
        run: >
          python3 scripts/consistency/benchmark-fft.py prepare-reference
          build/consistency-${{ matrix.config }} out/fft-reference-${{ matrix.platform }}

      # The fixture/repeat helpers are EXCLUDE_FROM_ALL, so name the tool targets explicitly.
      - name: Build
        run: >
          cmake --build build/consistency-${{ matrix.config }}
          --target mr_adm_phase2_tools mr_adm_render_common_numeric_tests mr_adm_fft_benchmark

      - name: Measure FFT performance and preserved bits
        if: matrix.config == 'a'
        run: >
          python3 scripts/consistency/benchmark-fft.py compare
          out/fft-reference-${{ matrix.platform }} build/consistency-${{ matrix.config }}/mr_adm_fft_benchmark
          out/fft-performance-${{ matrix.platform }}.json

      - name: Upload FFT performance
        if: always() && matrix.config == 'a'
        uses: actions/upload-artifact@v7
        with:
          name: fft-performance-${{ matrix.platform }}
          path: out/fft-performance-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Test vector length rounding
        run: build/consistency-${{ matrix.config }}/mr_adm_render_common_numeric_tests

      - name: Test consistency utilities
        shell: bash
        run: >
          python3 tests/unit/consistency_tools_test.py
          --pcm-bits build/consistency-${{ matrix.config }}/mr_adm_pcm_bits --bash "$BASH"

      - name: Test numeric build controls
        shell: bash
        run: |
          python3 tests/unit/consistency_build_test.py
          python3 tests/unit/consistency_checkpoints_test.py
          python3 tests/unit/fft_benchmark_test.py
          python3 tests/unit/phase2_tools_test.py --scene build/consistency-${{ matrix.config }}/mr_adm_phase2_scene

      - name: Collect Rust phase-2 baseline
        run: >
          python3 scripts/consistency/run-rust-phase2.py
          build/consistency-${{ matrix.config }} out/${{ matrix.platform }} --config ${{ matrix.config }}

      # The build record travels with the PCM. A controlled-build result only means something
      # alongside evidence that the flags reached the compiler, which BLAS backend SAF picked,
      # and how many explicit FMA instructions survived — the option alone proves none of that.
      # build-info fails if strict commands are missing or conflicting flags survived generation.
      - name: Record build
        if: always()
        run: |
          bash scripts/consistency/build-info.sh \
            build/consistency-${{ matrix.config }} \
            out/${{ matrix.platform }}/build-info.txt
          bash scripts/consistency/scan-fp.sh \
            build/consistency-${{ matrix.config }}/mradm \
            out/${{ matrix.platform }}/scan-fp.txt

      # Record the baseline before these sequential, explicitly labelled build interventions.
      - name: Upload baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consistency-${{ matrix.platform }}-${{ matrix.config }}
          path: out/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

      - name: Rebuild and collect diagnostics
        run: |
          cmake -S . -B build/consistency-${{ matrix.config }} -DMR_ADM_CONSISTENCY_DIAGNOSTICS=ON
          cmake --build build/consistency-${{ matrix.config }} --target mr_adm_phase2_tools
          python3 scripts/consistency/run-rust-phase2.py build/consistency-${{ matrix.config }} out/${{ matrix.platform }}-diagnostic --config ${{ matrix.config }} --baseline out/${{ matrix.platform }}

      - name: Upload diagnostic baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consistency-${{ matrix.platform }}-${{ matrix.config }}-diagnostic
          path: out/${{ matrix.platform }}-diagnostic
          if-no-files-found: error
          retention-days: 14

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

  render-windows:
    name: Windows render (config ${{ matrix.config }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: a
            numeric_flags: "-DMR_ADM_STRICT_FP=OFF -DMR_ADM_EAR_SCALAR_REFERENCE=OFF -DEAR_SIMD=ON"
          - config: b
            numeric_flags: "-DMR_ADM_STRICT_FP=ON -DMR_ADM_EAR_SCALAR_REFERENCE=ON -DEAR_SIMD=ON"

    env:
      FC_CACHE_DIR: ${{ github.workspace }}\.fc-cache
      SCCACHE_DIR: ${{ github.workspace }}\.sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Restore FetchContent cache
        uses: actions/cache@v5
        with:
          path: .fc-cache
          key: fc-${{ runner.os }}-${{ hashFiles('cmake/MRDependencies.cmake', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            fc-${{ runner.os }}-

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            build/rust/
          key: cargo-${{ runner.os }}-consistency-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-consistency-

      - name: Restore sccache cache
        uses: actions/cache@v5
        with:
          path: .sccache
          key: sccache-${{ runner.os }}-consistency-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            sccache-${{ runner.os }}-consistency-${{ matrix.config }}-
            sccache-${{ runner.os }}-

      - name: Locate MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installPath)) {
            throw "Visual Studio with VC tools was not found"
          }
          $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) {
            throw "vcvars64.bat not found at $vcvars"
          }
          "VCVARS64=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Windows has no CMake preset in this repository; the canonical path is a hand-written
      # Ninja + cl configure, mirrored from ci.yml with Release instead of Debug. The cache
      # variables the consistency-* presets set are spelled out here so the two paths stay
      # equivalent — the only intended difference between the configurations is NUMERIC_FLAGS.
      - name: Configure
        shell: cmd
        env:
          NUMERIC_FLAGS: ${{ matrix.numeric_flags }}
        run: |
          call "%VCVARS64%"
          cmake -S . -B build/win-canon -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DFETCHCONTENT_BASE_DIR="%FC_CACHE_DIR%" ^
            -DMR_ADM_CORE_BUILD_TESTS=ON ^
            -DMR_ADM_CORE_USE_INSTALLED_DEPS=OFF ^
            -DMR_ADM_FLAC_PROVIDER=VENDORED ^
            -DMR_ADM_OPUS_PROVIDER=VENDORED ^
            -DMR_ADM_ENABLE_IAMF=OFF ^
            -DMR_ADM_ENABLE_SOFA=ON ^
            -DMR_ADM_CONSISTENCY_DIAGNOSTICS=OFF ^
            %NUMERIC_FLAGS%

      - name: Prepare original scalar FFT benchmark
        if: matrix.config == 'a'
        shell: cmd
        run: |
          call "%VCVARS64%"
          python scripts/consistency/benchmark-fft.py prepare-reference build/win-canon out/fft-reference-windows

      - name: Build
        shell: cmd
        run: |
          call "%VCVARS64%"
          cmake --build build/win-canon --target mr_adm_phase2_tools mr_adm_render_common_numeric_tests mr_adm_fft_benchmark

      - name: Measure FFT performance and preserved bits
        if: matrix.config == 'a'
        shell: cmd
        run: |
          call "%VCVARS64%"
          python scripts/consistency/benchmark-fft.py compare out/fft-reference-windows build/win-canon/mr_adm_fft_benchmark.exe out/fft-performance-windows.json

      - name: Upload FFT performance
        if: always() && matrix.config == 'a'
        uses: actions/upload-artifact@v7
        with:
          name: fft-performance-windows
          path: out/fft-performance-windows.json
          if-no-files-found: error
          retention-days: 14

      - name: Test vector length rounding
        shell: cmd
        run: |
          call "%VCVARS64%"
          build\win-canon\mr_adm_render_common_numeric_tests.exe

      - name: Test consistency utilities
        shell: bash
        run: python tests/unit/consistency_tools_test.py --pcm-bits build/win-canon/mr_adm_pcm_bits.exe --bash "$(cygpath -w "$BASH")"

      - name: Test numeric build controls
        shell: cmd
        run: |
          call "%VCVARS64%"
          python tests/unit/consistency_build_test.py --c-compiler cl --cxx-compiler cl
          if errorlevel 1 exit /b 1
          python tests/unit/consistency_checkpoints_test.py
          if errorlevel 1 exit /b 1
          python tests/unit/fft_benchmark_test.py
          if errorlevel 1 exit /b 1
          python tests/unit/phase2_tools_test.py --scene build/win-canon/mr_adm_phase2_scene.exe

      # One render script for all three platforms. cmd loads the MSVC environment first so the
      # binaries find their runtime, then hands off to Git Bash so the matrix has a single
      # implementation rather than a PowerShell copy that can drift.
      - name: Collect Rust phase-2 baseline
        shell: cmd
        run: |
          call "%VCVARS64%"
          python scripts/consistency/run-rust-phase2.py build/win-canon out/windows --config ${{ matrix.config }}

      # scan-fp.sh needs a disassembler; Git Bash ships none, so it records that the scan was
      # skipped instead of failing. build-info.sh still captures whether /fp:precise and the
      # contraction switch actually reached cl.
      - name: Record build
        if: always()
        shell: bash
        env:
          PYTHON: python
        run: |
          bash scripts/consistency/build-info.sh build/win-canon out/windows/build-info.txt
          bash scripts/consistency/scan-fp.sh build/win-canon/mradm.exe out/windows/scan-fp.txt

      - name: Upload baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consistency-windows-${{ matrix.config }}
          path: out/windows
          if-no-files-found: error
          retention-days: 14

      - name: Rebuild and collect diagnostics
        shell: cmd
        run: |
          call "%VCVARS64%"
          cmake -S . -B build/win-canon -DMR_ADM_CONSISTENCY_DIAGNOSTICS=ON
          if errorlevel 1 exit /b 1
          cmake --build build/win-canon --target mr_adm_phase2_tools
          if errorlevel 1 exit /b 1
          python scripts/consistency/run-rust-phase2.py build/win-canon out/windows-diagnostic --config ${{ matrix.config }} --baseline out/windows

      - name: Upload diagnostic baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consistency-windows-${{ matrix.config }}-diagnostic
          path: out/windows-diagnostic
          if-no-files-found: error
          retention-days: 14

      - name: sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

  compare:
    name: Compare platforms
    runs-on: ubuntu-24.04
    needs:
      - render
      - render-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # No name: filter, so every artifact from this run lands in its own subdirectory
      # (the pattern release.yml uses for its publish job).
      - name: Download baselines
        uses: actions/download-artifact@v7
        with:
          path: baselines

      # Cross-platform differences are measured, except the bit-equality gates in
      # scripts/consistency/phase2-gates.json (ADR 0015). Every report is written before failing.
      - name: Compare both configurations and diagnostic checkpoints
        shell: bash
        run: |
          status=0
          for config in a b; do
            for suffix in "" "-diagnostic"; do
              python3 scripts/consistency/compare-rust-phase2.py \
                --output "consistency-report-${config}${suffix}.json" \
                "baselines/consistency-macos-${config}${suffix}" \
                "baselines/consistency-linux-${config}${suffix}" \
                "baselines/consistency-windows-${config}${suffix}" || status=1
            done
          done
          exit "$status"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consistency-report
          path: consistency-report-*.json
          if-no-files-found: error
          retention-days: 90
