name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-metadata:
    name: Version metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify source metadata
        run: python3 scripts/release/version_metadata.py --check

      - name: Verify GUI localization
        run: python3 scripts/quality/check_gui_i18n.py

      # Frozen Rust-migration references must stay registered and byte-identical.
      - name: Verify migration references
        run: python3 scripts/quality/check-reference-retention.py

  debug:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS debug
            runner: macos-26
            install: brew install cmake ninja boost ccache
          - name: Linux debug
            runner: ubuntu-24.04
            install: |
              sudo apt-get update
              sudo apt-get install -y cmake ninja-build build-essential git pkg-config ccache libboost-all-dev

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      FC_CACHE_DIR: ${{ github.workspace }}/.fc-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Install dependencies
        run: ${{ matrix.install }}

      - name: Restore FetchContent cache
        uses: actions/cache@v5
        with:
          path: .fc-cache
          key: fc-${{ runner.os }}-${{ hashFiles('cmake/MRDependencies.cmake', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            fc-${{ runner.os }}-

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            build/rust/
          key: cargo-${{ runner.os }}-debug-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-debug-

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-debug-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-debug-
            ccache-${{ runner.os }}-

      - name: Configure
        run: >
          cmake --preset debug
          -DFETCHCONTENT_BASE_DIR="$FC_CACHE_DIR"
          -DMR_ADM_FLAC_PROVIDER=VENDORED
          -DMR_ADM_OPUS_PROVIDER=VENDORED
          -DMR_ADM_ENABLE_IAMF=OFF
          -DMR_ADM_BUILD_CAPI_BUNDLE=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset debug

      # Manifest/SBOM/Cargo.lock coverage plus license-text drift for the dependencies this build fetched.
      - name: License records
        run: scripts/quality/check-licenses.sh --build-dir build/debug

      # The GUI bundle must export exactly the c_api.h functions; private Rust/C++ symbols stay inside.
      - name: C ABI exports
        run: python3 scripts/quality/check-capi-exports.py "build/debug/libmradm_capi.$([ "$RUNNER_OS" = macOS ] && echo dylib || echo so)"

      - name: Test
        run: ctest --preset debug --parallel "$(getconf _NPROCESSORS_ONLN)" --output-on-failure

      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

  windows-debug:
    name: Windows debug
    runs-on: windows-2025-vs2026

    env:
      FC_CACHE_DIR: ${{ github.workspace }}\.fc-cache
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-bincache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.vcpkg-bincache,readwrite
      VCPKG_FEATURE_FLAGS: binarycaching
      SCCACHE_DIR: ${{ github.workspace }}\.sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failures = [System.Collections.Generic.List[string]]::new()
          foreach ($path in (git ls-files "*.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            foreach ($parseError in $parseErrors) {
              $failures.Add(("{0}:{1}: {2}" -f $path, $parseError.Extent.StartLineNumber, $parseError.Message))
            }
          }
          if ($failures.Count -ne 0) {
            $failures | ForEach-Object { Write-Host $_ }
            throw "$($failures.Count) PowerShell syntax error(s) found"
          }

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Restore FetchContent cache
        uses: actions/cache@v5
        with:
          path: .fc-cache
          key: fc-windows-${{ hashFiles('cmake/MRDependencies.cmake', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            fc-windows-

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            build/rust/
          key: cargo-${{ runner.os }}-debug-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-debug-

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: .vcpkg-bincache
          key: vcpkg-ci-windows-boost-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            vcpkg-ci-windows-boost-
            vcpkg-windows-boost-

      - name: Restore sccache cache
        uses: actions/cache@v5
        with:
          path: .sccache
          key: sccache-windows-${{ github.sha }}
          restore-keys: |
            sccache-windows-

      - name: Install native dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          vcpkg install `
            boost-format `
            boost-functional `
            boost-algorithm `
            boost-integer `
            boost-iterator `
            boost-math `
            boost-optional `
            boost-range `
            boost-rational `
            boost-smart-ptr `
            boost-variant `
            --triplet x64-windows

      - name: Locate MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($installPath)) {
            throw "Visual Studio with VC tools was not found"
          }
          $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvars64.bat"
          if (!(Test-Path $vcvars)) {
            throw "vcvars64.bat not found at $vcvars"
          }
          "VCVARS64=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append

      # SOFA stays enabled to cover the pure Rust reader on Windows.
      - name: Configure
        shell: cmd
        run: |
          call "%VCVARS64%"
          cmake -S . -B build/windows -G Ninja ^
            -DCMAKE_BUILD_TYPE=Debug ^
            -DCMAKE_C_COMPILER=cl ^
            -DCMAKE_CXX_COMPILER=cl ^
            -DCMAKE_C_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DFETCHCONTENT_BASE_DIR="%FC_CACHE_DIR%" ^
            -DMR_ADM_CORE_BUILD_TESTS=ON ^
            -DMR_ADM_FLAC_PROVIDER=VENDORED ^
            -DMR_ADM_OPUS_PROVIDER=VENDORED ^
            -DMR_ADM_ENABLE_IAMF=OFF ^
            -DMR_ADM_BUILD_CAPI_BUNDLE=ON ^
            -DMR_ADM_ENABLE_SOFA=ON

      - name: Build
        shell: cmd
        run: |
          call "%VCVARS64%"
          cmake --build build/windows

      - name: C ABI exports
        shell: pwsh
        run: python scripts/quality/check-capi-exports.py build/windows/mradm_capi.dll

      # ctest 在 vcvars 环境内运行：Debug 测试可执行文件依赖 VS 的调试版 CRT DLL
      # （vcruntime140d/ucrtbased 等），这些只在 dev 环境的 PATH 上。
      - name: Test
        shell: cmd
        run: |
          call "%VCVARS64%"
          ctest --test-dir build/windows --output-on-failure -j %NUMBER_OF_PROCESSORS%

      - name: sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats
