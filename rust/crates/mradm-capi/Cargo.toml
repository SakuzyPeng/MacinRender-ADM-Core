[package]
name = "mradm-capi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The one Rust library CMake links: the public C ABI exports implemented in Rust, together with
# every private `mradm_*` entry of mradm-ffi that the C++ shells and islands call.
# The library name differs from the shared library's (`mradm_capi`): on Windows the staticlib and the
# DLL's import library would both be `mradm_capi.lib` in the CMake build directory.
[lib]
name = "mradm_rust"
crate-type = ["staticlib"]

[dependencies]
mradm-ffi = { path = "../mradm-ffi", default-features = false }

[features]
default = ["sofa"]
sofa = ["mradm-ffi/sofa"]
diagnostics = ["mradm-ffi/diagnostics"]
room-cuda = ["mradm-ffi/room-cuda"]
