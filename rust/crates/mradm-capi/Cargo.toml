[package]
name = "mradm-capi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The one Rust library CMake links: the public C ABI exports implemented in Rust, together with
# every private `mradm_*` entry of mradm-ffi that the C++ shells and islands call.
[lib]
crate-type = ["staticlib"]

[dependencies]
mradm-cli = { path = "../mradm-cli" }
mradm-ffi = { path = "../mradm-ffi", default-features = false }
mradm-dsp = { path = "../mradm-dsp", default-features = false }
mradm-json = { path = "../mradm-json" }
mradm-adm = { package = "macin-adm", git = "https://github.com/SakuzyPeng/MacinFormat-ADM-Core", rev = "158b1760e22ca87dc5a8a6b4a56d511581d4c86f" }
mradm-engine = { path = "../mradm-engine" }
mradm-osc = { path = "../mradm-osc" }
mradm-render = { path = "../mradm-render" }
mradm-scene = { path = "../mradm-scene" }
mradm-wav = { path = "../mradm-wav" }

[dev-dependencies]
mradm-testkit = { path = "../mradm-testkit" }

[features]
default = ["sofa"]
sofa = ["mradm-ffi/sofa"]
diagnostics = ["mradm-ffi/diagnostics"]
room-cuda = ["mradm-ffi/room-cuda"]
