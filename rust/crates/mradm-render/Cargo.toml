[package]
name = "mradm-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Loudspeaker and HOA backends, routing rules and the offline render driver"

[dependencies]
mradm-adm = { path = "../mradm-adm" }
mradm-dsp = { path = "../mradm-dsp", default-features = false }
mradm-ear = { path = "../mradm-ear" }
mradm-scene = { path = "../mradm-scene" }
mradm-wav = { path = "../mradm-wav" }

[dev-dependencies]
mradm-json = { path = "../mradm-json" }
