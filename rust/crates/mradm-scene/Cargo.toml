[package]
name = "mradm-scene"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Render scene: input import, channel beds, loudspeaker layout tables and the semantic policy"

[dependencies]
mradm-adm = { package = "macin-adm", git = "https://github.com/SakuzyPeng/MacinFormat-ADM-Core", rev = "158b1760e22ca87dc5a8a6b4a56d511581d4c86f" }
mradm-dsp = { path = "../mradm-dsp", default-features = false }
mradm-json = { path = "../mradm-json" }
mradm-wav = { path = "../mradm-wav" }

[dev-dependencies]
mradm-wav = { path = "../mradm-wav" }
