[package]
name = "mradm-dsp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
realfft.workspace = true
rustfft.workspace = true
nalgebra.workspace = true
libm.workspace = true
ebur128.workspace = true
rubato.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
rayon = "=1.11.0"
pulp = { version = "=0.22.3", default-features = false, features = ["std", "x86-v3"] }

# Room always needs the native decoder; the sofa feature gates the other binaural path.
sofar = { version = "=0.3.0", default-features = false }

[dev-dependencies]
# Native resource counters in offline performance probes; already in Cargo.lock.
libc = "=0.2.190"

[features]
diagnostics = []
# Room stage counters only; disabled in production and final benchmarks.
room-profile = []
# Coarse wall/CPU tracing avoids clocks inside arithmetic kernels.
room-trace = ["room-profile"]
# Opt-in research adapter; no GPU API is linked by the DSP library.
room-gpu-experiment = []
default = ["sofa"]
sofa = []
