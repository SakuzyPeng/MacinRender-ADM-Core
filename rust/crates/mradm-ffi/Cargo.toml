[package]
name = "mradm-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
mradm-dsp = { path = "../mradm-dsp", default-features = false }

[features]
default = ["sofa"]
sofa = ["mradm-dsp/sofa"]
