[package]
name = "mradm-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
mradm-ear = { path = "../mradm-ear" }
mradm-wav = { path = "../mradm-wav" }
mradm-adm = { package = "macin-adm", git = "https://github.com/SakuzyPeng/MacinFormat-ADM-Core", rev = "158b1760e22ca87dc5a8a6b4a56d511581d4c86f" }
mradm-osc = { path = "../mradm-osc" }
mradm-scene = { path = "../mradm-scene" }
mradm-render = { path = "../mradm-render" }
mradm-engine = { path = "../mradm-engine" }
mradm-dsp = { path = "../mradm-dsp", default-features = false }
mradm-room-cuda = { path = "../mradm-room-cuda", optional = true, default-features = false }
# The C/C++ islands and C libraries this crate calls by name (6.6).
mradm-islands-sys = { path = "../mradm-islands-sys" }
serde_json.workspace = true
libm.workspace = true

[dev-dependencies]
mradm-json = { path = "../mradm-json" }
mradm-math = { path = "../mradm-math" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[features]
diagnostics = ["mradm-dsp/diagnostics", "mradm-ear/diagnostics", "mradm-islands-sys/diagnostics"]
default = ["sofa"]
sofa = ["mradm-dsp/sofa", "mradm-render/sofa"]
room-cuda = ["dep:mradm-room-cuda"]
