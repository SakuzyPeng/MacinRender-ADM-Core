# Used only by scripts/quality/check-ffi-headers.py to render the Rust exports into a throwaway C
# header for comparison with the hand-written private FFI headers. C++ never includes the output.
language = "C"
documentation = false

[parse]
parse_deps = true
include = ["mradm-dsp", "macin-adm", "macin-bwf", "mradm-wav", "mradm-ear"]

# The C++ island tables and their records, and the Rust services table the islands call: no export
# signature reaches these types (check-ffi-headers.py pairs them by ISLAND_RECORDS).
[export]
include = [
    "AppleIslands",
    "AppleSettings",
    "DeviceEnumeration",
    "DeviceIslands",
    "DevicePull",
    "DeviceTable",
    "EngineBackend",
    "EngineIslandError",
    "EngineIslandReply",
    "EngineIslandStream",
    "EngineLayout",
    "EngineMode",
    "EngineProgress",
    "ApacEncoder",
    "EngineSceneDeviceProgress",
    "EngineSpatialLayout",
    "IamfEncodeOptions",
    "IslandContext",
    "PlatformIslands",
    "RenderLiveOverride",
    "RoomScreenGeometry",
    "RustServices",
    "RustTestServices",
]
