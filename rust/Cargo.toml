[workspace]
members = ["crates/mradm-dsp", "crates/mradm-ear", "crates/mradm-math", "crates/mradm-adm", "crates/mradm-wav", "crates/mradm-ffi"]
resolver = "2"
exclude = ["vendor/sofar", "vendor/rubato", "vendor/rustfft"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
# FFT stays on RustFFT's scalar planner: the SIMD backends (AVX/SSE/NEON) are picked at run time
# and use different decompositions and FMA, so their results differ across platforms (ADR 0015).
realfft = { version = "=3.5.0", default-features = false }
rustfft = { version = "=6.4.1", default-features = false }
# libm-force routes every simba/nalgebra scalar function (SVD rotations, hypot, atan2, ...) through
# the pure-Rust libm port instead of the platform C library (ADR 0017).
nalgebra = { version = "=0.35.0", default-features = false, features = ["std", "libm-force"] }
libm = { version = "=0.2.16" }
ebur128 = { version = "=0.1.10", default-features = false }
rubato = { version = "=5.0.1", default-features = false }

[profile.dev]
opt-level = 1
debug = 1
incremental = false

[profile.release]
debug = 0
incremental = false
panic = "unwind"

[profile.minsizerel]
inherits = "release"
opt-level = "s"
lto = "thin"


[patch.crates-io]
sofar = { path = "vendor/sofar" }
# Scalar interpolation and platform-independent sinc/window tables (ADR 0016).
rubato = { path = "vendor/rubato" }
# Preserve scalar FFT arithmetic while exposing independent columns to LLVM.
rustfft = { path = "vendor/rustfft" }
